name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The map is derived from the tree, not from history, but `git ls-files` decides
          # what counts as source — so a shallow checkout is fine and a sparse one is not.
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The experiment runner refuses to execute anything without bubblewrap, and its tests
      # skip the sandboxed cases (with a printed note) when it is absent — so without this
      # step CI only ever exercises the fail-closed path. Ubuntu 24.04 additionally gates
      # unprivileged user namespaces behind AppArmor. Unverified from the dev machine: if
      # either step fails here, the tests still pass, they just cover less.
      - name: sandbox for experiment tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:all

      # Reuses the parse cache written by the run above, so this is seconds rather than a
      # second full parse of the tree. --out is explicit: the default lives outside the checkout.
      - name: architecture check
        run: pnpm check . --out ./out --warn-only

      - name: upload the map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codemap
          path: |
            out/graph.json
            out/findings.json
            out/structure.json
            out/invariants.json
            out/plan.json
          if-no-files-found: ignore
